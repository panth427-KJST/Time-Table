function convertDashboard(dash, prev){
  const names = dash.sorted_teachers, idx = {}; names.forEach((n,i)=>idx[n]=i);
  const ts = names.map(n => { const rows=[]; dash.days.forEach((day,di)=>Object.entries(dash.teachers[n][day]||{}).sort((a,b)=>a[0]-b[0]).forEach(([p,c])=>rows.push([di,+p,c.code,c.subject,c['class'],c.room]))); return rows; });
  const cs = {}; dash.sorted_classes.forEach(cl => { const rows=[]; dash.days.forEach((day,di)=>Object.entries(dash.classes[cl][day]||{}).sort((a,b)=>a[0]-b[0]).forEach(([p,c])=>rows.push([di,+p,c.code,c.subject,(c.teachers||[]).filter(t=>t in idx).map(t=>idx[t]),c.room]))); cs[cl]=rows; });
  const duty = {}; if (prev && prev.duty) Object.entries(prev.duty).forEach(([ti,rows])=>{ const n=prev.teachers[ti]&&prev.teachers[ti].n; if (n in idx) duty[idx[n]]=rows; });
  return {term:SET.termName, days:dash.days, times:dash.period_times, groups:dash.group_order, noCover:prev.noCover, activity:prev.activity, lunch:prev.lunch,
    teachers:names.map(n=>({n, g:dash.group_order.indexOf(dash.teacher_groups[n])})), classes:dash.sorted_classes, ts, cs, duty, source:'นำเข้าจากไฟล์ Dashboard'};
}

/* ================================================================ events */
document.addEventListener('click', async e => {
  if (!e.target.closest('[data-act="bell"]')){ const dd=$('.dd'); if (dd && (!e.target.closest('.dd') || e.target.closest('[data-act],[data-go]'))) setTimeout(()=>dd.remove()); }
  const go = e.target.closest('[data-go]');
  if (go){ VIEW=go.dataset.go; if (VIEW==='new' && !W) newDraft(); if (VIEW==='log') UI.log=null; if (VIEW==='settings') UI.admin=null; closeModal(); render(); window.scrollTo(0,0); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (e.target.closest('[data-stop]') && el.dataset.act==='open') return;
  const a = el.dataset.act, rid = el.dataset.rid, iid = el.dataset.iid;
  switch(a){
    case 'demologin': doLogin(el.dataset.u, '1234'); break;
    case 'logout': case 'menu':
      if (a==='menu'){ confirmModal('บัญชีผู้ใช้', `<div><b>${esc(ME.name)}</b><div class="small muted">${esc(ME.username)} · ${esc(roleText())}</div></div>`, 'ออกจากระบบ', async ()=>{ await call('apiLogout'); forget(); W=null; render(); }); break; }
      await call('apiLogout'); forget(); W=null; closeModal(); render(); break;
    case 'demoreset': confirmModal('ล้างข้อมูลทดลอง','ลบข้อมูลทดลองทั้งหมดและสร้างข้อมูลตัวอย่างใหม่?','ล้างข้อมูล',()=>{ window.demoReset(); }); break;
    case 'bell': { const old=$('.dd'); if (old){ old.remove(); break; } const n=notifications(); const d=document.createElement('div'); d.className='dd';
      d.innerHTML = n.length ? n.map(x=>`<div class="it" ${x.rid?`data-act="open" data-rid="${x.rid}"`:`data-go="${x.go}"`}>${esc(x.t)}</div>`).join('') : '<div class="it muted">ไม่มีการแจ้งเตือน</div>';
      document.body.appendChild(d); break; }
    case 'open': openReq(rid); break;
    case 'close': UI.fix=null; closeModal(); break;
    case 'wtype': W.req.type=el.dataset.k; regen(); render(); break;
    case 'pfull': delete W.partial[el.dataset.d]; regen(); render(); break;
    case 'ppart': { const d=el.dataset.d; W.partial[d]=true; if (!W.sel[d]) W.sel[d]=[]; regen(); render(); break; }
    case 'pslot': { const d=el.dataset.d, p=+el.dataset.p, s=W.sel[d]||(W.sel[d]=[]); const i=s.indexOf(p); if (i>=0) s.splice(i,1); else s.push(p); regen(); render(); break; }
    case 'unfile': W.req.file=null; render(); break;
    case 'iopen': UI.open = UI.open===iid ? null : iid; UI.fix ? renderFixModal() : render(); break;
    case 'itab': UI.tab[iid]=el.dataset.m; UI.fix ? renderFixModal() : render(); break;
    case 'more': UI.more[iid]=!UI.more[iid]; UI.fix ? renderFixModal() : render(); break;
    case 'pick': { const [r,it]=findItem(iid); it.method='sub'; it.sub=+el.dataset.ti; delete it.swap; afterPick(r,it); break; }
    case 'pickT': { const [r,it]=findItem(iid); const o=UI.cache[iid+'T'].list[+el.dataset.k]; it.method='swapT'; it.swap={t:o.t,date:o.date,p:o.p,code:o.code,subj:o.subj}; delete it.sub; afterPick(r,it); break; }
    case 'pickF': { const [r,it]=findItem(iid); const o=UI.cache[iid+'F'].list[+el.dataset.k]; it.method='swapF'; it.swap={date:o.date,p:o.p}; delete it.sub; afterPick(r,it); break; }
    case 'pickN': { const [r,it]=findItem(iid); it.method='none'; delete it.sub; delete it.swap; afterPick(r,it); break; }
    case 'autofill': { const r=W.req; for (const it of E.coverItems(r)) if (!it.method){
        if (E.ACT[it.code]) { it.method='none'; continue; }
        const c=E.candSub(r,it); if (c.avail.length){ it.method='sub'; it.sub=c.avail[0].ti; it.ack='pending'; } }
      UI.open=(E.coverItems(r).find(i=>!i.method)||{}).id||null; render(); break; }
    case 'wcancel': W=null; VIEW='home'; render(); break;
    case 'wsubmit': confirmSubmit(); break;
    case 'wsend': doSubmit(); break;
    case 'ack': { const r = await act('apiAck', [rid, [iid]], 'รับทราบแล้ว'); if (r && UI.detail) renderDetail(); break; }
    case 'ackall': act('apiAckAll', [], 'รับทราบทั้งหมดแล้ว'); break;
    case 'decline': promptModal('ขอเปลี่ยน (ไม่สะดวกสอนแทน)','ระบุเหตุผล เช่น ติดคุมสอบ / มีนัดผู้ปกครอง', v => act('apiDecline', [rid, iid, v], 'แจ้งผู้จัดให้จัดใหม่แล้ว')); break;
    case 'fixitem': { const R=REQ.find(x=>x.id===rid); const clone = JSON.parse(JSON.stringify(R)); const it=clone.items.find(i=>i.id===iid);
      const prev=E.ackWho(it); UI.fix={req:clone, iid, prevWho:prev, note:it.declNote};
      it.declinedBy=[...(it.declinedBy||[]), prev].filter(x=>x!=null); it.method=null; it.ack=null; delete it.sub; delete it.swap; UI.tab[iid]='sub'; renderFixModal(); break; }
    case 'fixcancel': UI.fix=null; closeModal(); render(); break;
    case 'fixsave': { const {req, iid:fi}=UI.fix, ni=req.items.find(i=>i.id===fi); UI.fix=null; closeModal();
      const r = await act('apiFix', [req.id, {id:ni.id, method:ni.method, sub:ni.sub, swap:ni.swap}], 'บันทึกแล้ว — แจ้งผู้ถูกจัดแล้ว'); if (r) openReq(req.id); break; }
    case 'approve': { const r = await act('apiApprove', [[rid]], 'เห็นชอบแล้ว'); if (r) openReq(rid); break; }
    case 'checkall': document.querySelectorAll('.apck:not(:disabled)').forEach(x=>x.checked=el.checked); break;
    case 'bulkapprove': { const ids=[...document.querySelectorAll('.apck:checked')].map(x=>x.value); if (!ids.length){ toast('ยังไม่ได้เลือกรายการ'); break; }
      confirmModal('เห็นชอบ', `เห็นชอบการจัดสอนแทน <b>${ids.length}</b> รายการ?`, 'เห็นชอบ', ()=>act('apiApprove', [ids], `เห็นชอบ ${ids.length} รายการ`)); break; }
    case 'return': promptModal('ส่งกลับแก้ไข','ระบุสิ่งที่ต้องแก้ไข', v => act('apiReturn', [rid, v], 'ส่งกลับแล้ว')); break;
    case 'editreq': { const R=REQ.find(x=>x.id===rid); const req=JSON.parse(JSON.stringify(R));
      W={editId:R.id, req, start:R.dates[0], end:R.dates[R.dates.length-1], partial:{}, sel:{}};
      if (R.slots) Object.entries(R.slots).forEach(([d,ps])=>{ W.partial[d]=true; W.sel[d]=ps.slice(); });
      UI.open=null; closeModal(); VIEW='new'; regen(); render(); break; }
    case 'cancelreq': promptModal('ยกเลิกคำขอ','เหตุผลการยกเลิก (ครูที่ถูกจัดจะได้รับแจ้ง)', v => act('apiCancel', [rid, v], 'ยกเลิกแล้ว')); break;
    case 'printreq': printReq(REQ.find(x=>x.id===rid)); break;
    case 'ltab': UI.listTab=el.dataset.k; render(); break;
    case 'aptab': UI.apTab=el.dataset.k; render(); break;
    case 'bday': UI.board=el.dataset.d; render(); break;
    case 'bprint': printBoard(el.dataset.d); break;
    case 'ssort': UI.statSort=el.dataset.k; render(); break;
    case 'person': personModal(+el.dataset.ti); break;
    case 'csv': exportCSV(); break;
    case 'logreload': UI.log=null; render(); break;
    case 'savecfg': {
      const patch={}; document.querySelectorAll('[data-cfg]').forEach(x=>{ patch[x.dataset.cfg] = x.dataset.cfg==='HOLIDAYS' ? x.value.split(/\s+/).filter(Boolean).join(',') : x.value; });
      const heads={}; document.querySelectorAll('[data-head]').forEach(x=>{ if (x.value) heads[x.dataset.head]=x.value; }); patch.DEPT_HEADS=JSON.stringify(heads);
      const r = await call('apiSaveSettings', patch);
      if (!r.ok){ alertModal('บันทึกไม่สำเร็จ', r.error); break; }
      toast('บันทึกการตั้งค่าแล้ว'); UI.admin=null; await bootstrap(); VIEW='settings'; render(); break; }
    case 'ttimport': {
      const f=$('#ttfile').files[0]; if (!f){ toast('เลือกไฟล์ก่อน'); break; }
      const text = await f.text(); let data;
      try {
        if (/^\s*[{[]/.test(text)) { data = JSON.parse(text); }
        else { const m = text.match(/<script id="data" type="application\/json">([\s\S]*?)<\/script>/); if (!m) throw new Error('ไม่พบข้อมูลตารางสอนในไฟล์'); data = JSON.parse(m[1]); }
        if (!data.ts) data = convertDashboard(data, D);
      } catch(err){ alertModal('อ่านไฟล์ไม่สำเร็จ', String(err.message||err)); break; }
      confirmModal('นำเข้าตารางสอน', `ครู <b>${data.teachers.length}</b> คน · ห้อง <b>${Object.keys(data.cs||{}).length}</b> ห้อง · คาบ <b>${data.ts.reduce((s,x)=>s+x.length,0)}</b> ช่อง<br><span class="small muted">แทนที่ตารางสอนปัจจุบัน</span>`, 'นำเข้า', async ()=>{
        const r = await call('apiImportTimetable', data);
        if (!r.ok){ alertModal('นำเข้าไม่สำเร็จ', r.error); return; }
        toast('นำเข้าตารางสอนแล้ว'); UI.admin=null; await bootstrap(); VIEW='settings'; render(); });
      break; }
  }
});
document.addEventListener('change', async e => {
  const t=e.target;
  if (t.dataset.w){ const k=t.dataset.w, r=W.req;
    if (k==='teacher'){ r.teacher=+t.value; if (r.teacher!==ME.ti && !isPriv()) r.type='sick'; r.items=[]; regen(); render(); }
    else if (k==='start'){ W.start=t.value; if (!W.end||W.end<W.start) W.end=W.start; regen(); render(); }
    else if (k==='end'){ W.end=t.value; regen(); render(); }
    else if (k==='reason') r.reason=t.value;
    else if (k==='file'){ const f=t.files[0]; if (!f) return; if (f.size>5e6){ toast('ไฟล์ใหญ่เกิน 5 MB'); t.value=''; return; }
      const b64 = await new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(',')[1]); fr.readAsDataURL(f); });
      const up = await call('apiUpload', {name:f.name, mime:f.type, b64});
      if (!up.ok){ alertModal('อัปโหลดไม่สำเร็จ', up.error); return; } r.file=up.file; render(); }
    return; }
  if (t.dataset.act==='bpick'){ UI.board=t.value; render(); return; }
  if (t.dataset.s){ UI[t.dataset.s]=t.value; render(); return; }
  if (t.dataset.umap!=null){ const r = await call('apiSetUserMap', t.dataset.umap, t.value); if (!r.ok) alertModal('บันทึกไม่สำเร็จ', r.error); else toast('จับคู่แล้ว'); UI.admin=null; render(); }
});
document.addEventListener('keydown', e => { if (e.key==='Enter' && e.target.dataset && e.target.dataset.act==='logq'){ UI.logQ=e.target.value; UI.log=null; render(); } });

/* ---------- boot ---------- */
(function(){ try{ TOKEN = localStorage.getItem(TOKEN_KEY); }catch(e){}
  if (TOKEN) bootstrap(); else render(); })();
</script>
</body>
</html>
