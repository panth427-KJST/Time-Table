<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบจัดสอนแทน KJST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap">
<style>
/* ระบบจัดสอนแทน (Mockup) — โทนสีเดียวกับ KJST TimeTable Studio: กรมท่า + ทอง */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --surface2:#F8F9FC; --ink:#152038; --muted:#5E6782; --line:#DDE2EC; --soft:#EEF1F7;
  --navy:#0a2463; --navy2:#1d3a8a; --navy-ink:#fff; --accent:#1d3a8a; --gold:#d4a017; --gold2:#f4c430; --gold-soft:#FDF4DC;
  --ok:#15803d; --ok-bg:#DCFCE7; --warn:#B45309; --warn-bg:#FEF3C7; --bad:#B91C1C; --bad-bg:#FEE2E2; --info:#1D4ED8; --info-bg:#DBEAFE; --mute-bg:#EEF0F4;
  --t-personal:#B45309; --t-personal-bg:#FEF3C7; --t-official:#1D4ED8; --t-official-bg:#DBEAFE;
  --t-mission:#7C3AED; --t-mission-bg:#EDE9FE; --t-sick:#BE123C; --t-sick-bg:#FFE4E6;
  --g0:#C23B5A; --g1:#2F64C0; --g2:#23874D; --g3:#B07612; --g4:#C9601E; --g5:#8A4FC2; --g6:#8A6440; --g7:#1A8597; --g8:#56708A;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --f-body:'Sarabun','Leelawadee UI','Thonburi',system-ui,sans-serif;
  --f-head:'Prompt','Sarabun','Leelawadee UI',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1222; --surface:#161D31; --surface2:#1A2238; --ink:#E6EAF5; --muted:#9AA3C0; --line:#2A3352; --soft:#1F2843;
  --navy:#111A3D; --navy2:#1B2A63; --accent:#9DB0F5; --gold:#E3B654; --gold2:#F2CD72; --gold-soft:#3A3120;
  --ok:#4ADE80; --ok-bg:#12321F; --warn:#FBBF24; --warn-bg:#3A2D10; --bad:#F87171; --bad-bg:#3B1717; --info:#93B4FF; --info-bg:#1A2A4F; --mute-bg:#242B40;
  --t-personal:#FBBF24; --t-personal-bg:#3A2D10; --t-official:#93B4FF; --t-official-bg:#1A2A4F;
  --t-mission:#C4B5FD; --t-mission-bg:#2C2250; --t-sick:#FDA4AF; --t-sick-bg:#3F1621;
  --g0:#F28CA4; --g1:#8DB4F5; --g2:#7FD3A2; --g3:#E9C06A; --g4:#F2A26C; --g5:#C9A2F0; --g6:#D2AE88; --g7:#79CEDC; --g8:#A7BBCF;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1222; --surface:#161D31; --surface2:#1A2238; --ink:#E6EAF5; --muted:#9AA3C0; --line:#2A3352; --soft:#1F2843;
  --navy:#111A3D; --navy2:#1B2A63; --accent:#9DB0F5; --gold:#E3B654; --gold2:#F2CD72; --gold-soft:#3A3120;
  --ok:#4ADE80; --ok-bg:#12321F; --warn:#FBBF24; --warn-bg:#3A2D10; --bad:#F87171; --bad-bg:#3B1717; --info:#93B4FF; --info-bg:#1A2A4F; --mute-bg:#242B40;
  --t-personal:#FBBF24; --t-personal-bg:#3A2D10; --t-official:#93B4FF; --t-official-bg:#1A2A4F;
  --t-mission:#C4B5FD; --t-mission-bg:#2C2250; --t-sick:#FDA4AF; --t-sick-bg:#3F1621;
  --g0:#F28CA4; --g1:#8DB4F5; --g2:#7FD3A2; --g3:#E9C06A; --g4:#F2A26C; --g5:#C9A2F0; --g6:#D2AE88; --g7:#79CEDC; --g8:#A7BBCF;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-head);font-weight:600;margin:0;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px} .nowrap{white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}

/* ---------- header ---------- */
header.top{background:linear-gradient(120deg,var(--navy) 0%,var(--navy2) 80%);color:#fff;border-bottom:4px solid var(--gold)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:50%;background:#fff;padding:3px;border:2px solid var(--gold);flex:none;object-fit:contain}
.brand h1{font-size:18px;color:#fff;letter-spacing:.2px}
.brand .sub{font-size:12.5px;opacity:.85}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.bell{position:relative;background:rgba(255,255,255,.12);border:0;border-radius:10px;width:40px;height:40px;display:grid;place-items:center;color:#fff;cursor:pointer}
.bell .dot{position:absolute;top:4px;right:4px;background:var(--gold2);color:#231b00;font-size:11px;font-weight:700;border-radius:9px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.me{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border-radius:10px;padding:4px 10px 4px 4px;cursor:pointer;border:0;color:#fff;max-width:280px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;background:var(--gold);color:#231b00}
.me .nm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .rl{font-size:11.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.tabs-in{max-width:1280px;margin:0 auto;padding:0 8px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:12px 14px;font-weight:600;font-size:14.5px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent);border-bottom-color:var(--gold)}
.tab .c{background:var(--bad);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;min-width:18px;text-align:center}
.demo-bar{background:var(--gold-soft);color:var(--ink);font-size:13px;border-bottom:1px solid var(--line)}
.demo-bar .in{max-width:1280px;margin:0 auto;padding:6px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
main{max-width:1280px;margin:0 auto;padding:18px 16px 60px}

/* ---------- generic ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h3{font-size:16px}
.card-b{padding:14px 16px}
.page-h{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.page-h h2{font-size:22px}
.page-h .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
@media (max-width:640px){.brand .sub{display:none}.me .rl{display:none}.me{max-width:150px}}
.g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:900px){.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--navy2);border-color:var(--navy2);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#231b00}
.btn.ok{background:#15803d;border-color:#15803d;color:#fff}
.btn.bad{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap;line-height:1.6}
.chip .d{width:7px;height:7px;border-radius:50%;background:currentColor}
.s-ack{background:var(--warn-bg);color:var(--warn)} .s-fix{background:var(--bad-bg);color:var(--bad)}
.s-review{background:var(--info-bg);color:var(--info)} .s-approved{background:var(--ok-bg);color:var(--ok)}
.s-returned{background:var(--bad-bg);color:var(--bad)} .s-cancelled{background:var(--mute-bg);color:var(--muted)}
.s-na{background:var(--mute-bg);color:var(--muted)}
.ty-personal{background:var(--t-personal-bg);color:var(--t-personal)} .ty-official{background:var(--t-official-bg);color:var(--t-official)}
.ty-mission{background:var(--t-mission-bg);color:var(--t-mission)} .ty-sick{background:var(--t-sick-bg);color:var(--t-sick)}
.gtag{display:inline-block;border-radius:6px;padding:0 7px;font-size:12px;font-weight:600;border:1px solid currentColor;white-space:nowrap;line-height:1.6}
input[type=text],input[type=date],input[type=password],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:14.5px;width:100%}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field{margin-bottom:12px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--soft)}
table.t th.sort{cursor:pointer} table.t th.sort:hover{color:var(--ink)}
.tbl-wrap{overflow-x:auto}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.kpi{padding:14px 16px;border-left:4px solid var(--gold)}
.kpi .v{font-family:var(--f-head);font-size:28px;font-weight:700;line-height:1.1}
.kpi .l{font-size:13px;color:var(--muted);margin-top:2px}
.note{background:var(--info-bg);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13.5px;border-left:4px solid var(--info)}
.note.warn{background:var(--warn-bg);border-left-color:var(--warn)}
.note.bad{background:var(--bad-bg);border-left-color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
hr.sep{border:0;border-top:1px solid var(--line);margin:12px 0}

/* ---------- stepper ---------- */
.steps{display:flex;gap:0;align-items:center;flex-wrap:wrap;font-size:13px}
.step{display:flex;align-items:center;gap:6px;color:var(--muted)}
.step .b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--mute-bg);color:var(--muted)}
.step.done{color:var(--ok)} .step.done .b{background:var(--ok);color:#fff}
.step.cur{color:var(--ink);font-weight:600} .step.cur .b{background:var(--gold);color:#231b00}
.step.err{color:var(--bad)} .step.err .b{background:var(--bad);color:#fff}
.step+.step:before{content:"";width:22px;height:2px;background:var(--line);margin:0 6px}

/* ---------- wizard ---------- */
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:900px){.types{grid-template-columns:1fr 1fr}}
.type{border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:var(--surface);text-align:left}
.type:hover{border-color:var(--accent)}
.type.on{border-color:var(--gold);background:var(--gold-soft)}
.type .h{display:flex;align-items:center;gap:8px;font-weight:700;font-family:var(--f-head)}
.type .h i{width:12px;height:12px;border-radius:4px;display:inline-block}
.type p{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
.type:disabled{opacity:.4;cursor:not-allowed}
.item{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:10px;overflow:hidden}
.item.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.item.need{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.item-h{display:flex;gap:10px;align-items:center;padding:10px 14px;cursor:pointer;flex-wrap:wrap}
.item-h .per{background:var(--navy2);color:#fff;border-radius:8px;padding:3px 9px;font-weight:700;font-size:13px;white-space:nowrap}
.item-h .what{font-weight:600}
.item-h .pick{margin-left:auto;font-size:13.5px}
.item-b{border-top:1px dashed var(--line);padding:12px 14px;background:var(--surface2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy2);color:#fff}
.cand{display:grid;grid-template-columns:26px 1fr auto auto auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.cand:hover{background:var(--soft)}
.cand.sel{border-color:var(--gold);background:var(--gold-soft)}
.cand .rk{width:24px;height:24px;border-radius:50%;background:var(--mute-bg);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.cand.sel .rk{background:var(--gold);color:#231b00}
.cand .nm{font-weight:600;min-width:0}
.cand .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.load{display:flex;gap:2px;align-items:center}
.load i{width:7px;height:14px;border-radius:2px;background:var(--line)}
.load i.f{background:var(--accent)}
.load i.s{background:var(--gold)}
.cand-h{display:grid;grid-template-columns:26px 1fr auto auto auto;gap:10px;padding:4px 10px;font-size:12px;color:var(--muted);font-weight:600}
@media (max-width:640px){.cand,.cand-h{grid-template-columns:24px 1fr auto}.cand .hm,.cand-h .hm{display:none}}
.blocked{margin-top:8px;font-size:13px}
.blocked summary{cursor:pointer;color:var(--muted);font-weight:600}
.blocked ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.opt:hover{background:var(--soft)} .opt.sel{border-color:var(--gold);background:var(--gold-soft)}
.opt .when{font-weight:700;white-space:nowrap;min-width:150px}
.sticky-foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:center;border-radius:0 0 14px 14px;flex-wrap:wrap;z-index:5}
.prog{height:8px;border-radius:4px;background:var(--mute-bg);overflow:hidden;width:160px}
.prog i{display:block;height:100%;background:var(--ok)}

/* ---------- day strip ---------- */
.strip{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
@media (max-width:640px){.strip{grid-template-columns:repeat(3,1fr)}}
.slot{border-radius:8px;padding:6px;font-size:12px;min-height:58px;background:var(--surface2);border:1px solid var(--line)}
.slot b{display:block;font-size:11.5px;color:var(--muted)}
.slot.teach{background:var(--info-bg);border-color:transparent}
.slot.subst{background:var(--gold-soft);border-color:var(--gold)}
.slot.off{background:repeating-linear-gradient(45deg,var(--mute-bg),var(--mute-bg) 6px,transparent 6px,transparent 12px)}
.slot.nt{background:var(--mute-bg)}

/* ---------- heatmap / bars ---------- */
.heat{display:grid;grid-template-columns:70px repeat(9,1fr);gap:3px;font-size:12px}
.heat div{padding:6px 2px;text-align:center;border-radius:5px}
.heat .hd{color:var(--muted);font-weight:600}
.bar{display:grid;grid-template-columns:150px 1fr 40px;gap:8px;align-items:center;font-size:13px;margin-bottom:6px}
.bar .tr{height:16px;background:var(--mute-bg);border-radius:4px;overflow:hidden;display:flex}
.bar .tr i{display:block;height:100%}

/* ---------- timeline ---------- */
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 12px 22px;font-size:13.5px}
.tl li:before{content:"";position:absolute;left:5px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.tl li:after{content:"";position:absolute;left:9px;top:17px;bottom:0;width:1px;background:var(--line)}
.tl li:last-child:after{display:none}

/* ---------- modal / toast / dropdown ---------- */
.ov{position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.modal{background:var(--surface);border-radius:16px;max-width:960px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal.sm{max-width:480px}
.modal-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.modal-h h3{font-size:17px}
.modal-b{padding:16px 18px}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{margin-left:auto;background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:10px;z-index:200;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.dd{position:absolute;right:16px;top:58px;width:360px;max-width:calc(100vw - 24px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.18);z-index:90}
.dd .it{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13.5px}
.dd .it:hover{background:var(--soft)}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 55%,var(--bg) 55%)}
.login .box{width:100%;max-width:440px}
.login .head{text-align:center;color:#fff;margin-bottom:16px}
.login .head img{width:84px;height:84px;border-radius:50%;background:#fff;border:3px solid var(--gold);padding:4px}
.login .head h1{font-size:22px;color:#fff;margin-top:8px}
.quick{display:grid;gap:8px}
.quick button{text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 12px;cursor:pointer}
.quick button:hover{border-color:var(--accent)}
.quick b{display:block;font-size:14px} .quick span{font-size:12.5px;color:var(--muted)}

/* ---------- print ---------- */
#print{display:none}
@media print{
  body *{visibility:hidden}
  #print,#print *{visibility:visible}
  #print{display:block;position:absolute;left:0;top:0;width:100%;color:#000;background:#fff;font-size:13px}
  #print table{width:100%;border-collapse:collapse} #print th,#print td{border:1px solid #444;padding:4px 6px;text-align:left}
  #print h2{font-size:18px;text-align:center} #print .sig{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:28px;text-align:center}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="print"></div>
<script>
"use strict";
/* ================================================================

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const addD = (s,n) => { const d=pd(s); d.setDate(d.getDate()+n); return isoOf(d); };
const wd = s => { const g=pd(s).getDay(); return g>=1&&g<=5 ? g-1 : -1; };
const TODAY = isoOf(new Date());
const fmtD = s => { const d=pd(s); return `${WDS[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]} ${String(d.getFullYear()+543).slice(2)}`; };
const fmtL = s => { const d=pd(s); return `วัน${WDN[d.getDay()]}ที่ ${d.getDate()} ${MONL[d.getMonth()]} ${d.getFullYear()+543}`; };
const fmtDT = t => { const d=new Date(t); return `${d.getDate()} ${MON[d.getMonth()]} ${String(d.getFullYear()+543).slice(2)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const diffDays = (a,b) => Math.round((pd(b)-pd(a))/864e5);
const tn = ti => ti==null ? 'หัวหน้ากลุ่มบริหารงานวิชาการ' : D.teachers[ti].n;
const sn = ti => ti==null ? 'หน.วิชาการ' : D.teachers[ti].n.replace(/^(ว่าที่ร้อยตรี|สิบเอก|นางสาว|นาง|นาย|Mr\.\s?|Ms\.\s?)/,'');

/* ---------- calendar ---------- */
function isSchool(s){ return wd(s)>=0 && !S.settings.holidays.includes(s) && s>=S.settings.termStart && s<=S.settings.termEnd; }
function schoolDays(a,b){ const r=[]; for(let s=a; s<=b; s=addD(s,1)) if(isSchool(s)) r.push(s); return r; }
function nthSchool(k){ // k>=0 : k-th school day from today (0 = today or next), k<0 : previous
  let s=TODAY, n=0;
  let guard=0;
  if (k>=0){ while(!isSchool(s) && guard++<400) s=addD(s,1); while(n<k && guard++<400){ s=addD(s,1); if(isSchool(s)) n++; } return guard>=400 ? TODAY : s; }
  while(n>k){ s=addD(s,-1); if(isSchool(s)) n--; if(s<S.settings.termStart) return null; } return s;
}
const maxDate = () => addD(TODAY, S.settings.maxAhead);

  const O = {leave:{}, occ:{}, freed:{}, classIn:{}};
  const reqs = S.requests.filter(r => !(extra && r.id===extra.id));
  if (extra) reqs.push(extra);
  for (const r of reqs){
    if (r.status==='cancelled') continue;
    for (const d of r.dates) O.leave[r.teacher+'|'+d] = r;
    for (const it of r.items){
      if (it===skipItem || (skipItem && it.id===skipItem.id && r===extra) || it.ack==='declined' || !it.method || it.method==='none') continue;
      if (it.method==='sub') O.occ[K(it.sub,it.date,it.p)] = {t:'สอนแทน', cls:it.cls, r};
      else if (it.method==='swapT'){ const s=it.swap;
        O.occ[K(s.t,it.date,it.p)] = {t:'สลับคาบ', cls:it.cls, r};
        O.freed[K(s.t,s.date,s.p)] = r;
        O.occ[K(r.teacher,s.date,s.p)] = {t:'สลับคาบ', cls:it.cls, r}; }
      else if (it.method==='swapF'){ const s=it.swap;
        O.occ[K(r.teacher,s.date,s.p)] = {t:'สอนชดเชย', cls:it.cls, r};
        O.classIn[it.cls+'|'+s.date+'|'+s.p] = r; }
    }
  }
  return O;
}
function busy(ti, d, p, O){
  const L = O.leave[ti+'|'+d]; if (L) return {kind:'leave', why:`${TYPES[L.type].label}ในวันนี้`};
  const o = O.occ[K(ti,d,p)];  if (o) return {kind:'sub', why:`ถูกจัด${o.t} ${o.cls} ให้ ${sn(o.r.teacher)} แล้ว`};
  const w = wd(d); const e = w>=0 && TAT[ti][w][p];
  if (e && !O.freed[K(ti,d,p)]) return {kind:'base', why:`มีสอน ${e.code} ${e.cls}`};
  return null;
}
function dayLoad(ti, d, O){ // จำนวนคาบสอนจริงในวันนั้น (ตารางปกติ + สอนแทน/สลับ)
  const w=wd(d); let base=0, extra=0;
  for (let p=1;p<=9;p++){ const e=TAT[ti][w][p];
    if (O.occ[K(ti,d,p)]) extra++; else if (e && !NT.has(e.code) && !O.freed[K(ti,d,p)]) base++; }
  return {base, extra, total:base+extra};
}
function cumSubs(){ const c={};
  for (const r of S.requests){ if (r.status==='cancelled') continue;
    for (const it of r.items){ if (it.ack==='declined') continue;
      if (it.method==='sub') c[it.sub]=(c[it.sub]||0)+1;
      if (it.method==='swapT') c[it.swap.t]=(c[it.swap.t]||0)+1; } }
  return c;
}
function candSub(req, item){
  const O = occupancy(req, item), C = cumSubs(), g = gOf(req.teacher), w = wd(item.date);
  const avail=[], blocked=[];
  D.teachers.forEach((t,ti) => {
    if (ti===req.teacher) return;
    if ((item.declinedBy||[]).includes(ti)){ blocked.push({ti, same:t.g===g, why:'ขอเปลี่ยนคาบนี้ไปแล้ว'}); return; }
    const b = busy(ti, item.date, item.p, O);
    if (!b) avail.push({ti, same:t.g===g, load:dayLoad(ti,item.date,O), cum:C[ti]||0, duty:DUTY[ti]?.[w]?.[item.p]});
    else if (b.kind!=='base') blocked.push({ti, same:t.g===g, why:b.why});
  });
  avail.sort((a,b)=>(b.same-a.same)||(a.load.total-b.load.total)||(a.cum-b.cum)||D.teachers[a.ti].n.localeCompare(D.teachers[b.ti].n,'th'));
  blocked.sort((a,b)=>(b.same-a.same));
  return {avail, blocked};
}
function swapWindow(req, item){
  const from = [TODAY, addD(item.date,-7)].sort()[1], to = [maxDate(), addD(item.date,14)].sort()[0];
  return schoolDays(from, to).filter(d => !req.dates.includes(d));
}
function candSwapT(req, item){
  if (!CAT[item.cls]) return {err:'คาบนี้เป็นกลุ่มเรียนรวม/กิจกรรม (ไม่ใช่ห้องเรียนปกติ) จึงสลับคาบกับครูอื่นไม่ได้'};
  const O = occupancy(req, item), g = gOf(req.teacher), list=[];
  for (const d of swapWindow(req,item)){ const w=wd(d);
    for (let p=1;p<=9;p++){ const ce=CAT[item.cls][w][p];
      if (!ce || NT.has(ce.code) || ce.tis.length!==1 || ce.tis[0]===req.teacher) continue;
      const B=ce.tis[0];
      if (O.freed[K(B,d,p)] || O.leave[B+'|'+d]) continue;
      if (d===TODAY) continue;
      if (busy(B, item.date, item.p, O)) continue;
      if (busy(req.teacher, d, p, O)) continue;
      list.push({t:B, date:d, p, code:ce.code, subj:ce.subj, same:gOf(B)===g});
    } }
  list.sort((a,b)=>Math.abs(diffDays(item.date,a.date))-Math.abs(diffDays(item.date,b.date)) || (b.same-a.same) || a.p-b.p);
  return {list};
}
function candSwapF(req, item){
  if (!CAT[item.cls]) return {err:'คาบนี้เป็นกลุ่มเรียนรวม/กิจกรรม จึงย้ายไปคาบว่างไม่ได้'};
  const O = occupancy(req, item), lunch = D.lunch[levelOf(item.cls)], list=[];
  for (const d of swapWindow(req,item)){ const w=wd(d); if (d===TODAY) continue;
    for (let p=1;p<=9;p++){
      if (CAT[item.cls][w][p] || p===lunch) continue;
      if (O.classIn[item.cls+'|'+d+'|'+p]) continue;
      if (busy(req.teacher, d, p, O)) continue;
      list.push({date:d, p});
    } }
  list.sort((a,b)=>Math.abs(diffDays(item.date,a.date))-Math.abs(diffDays(item.date,b.date)) || a.p-b.p);
  return {list};
}
function coTeachers(req, item){
  const ce = CAT[item.cls]?.[wd(item.date)]?.[item.p];
  if (!ce || ce.code!==item.code) return [];
  const O = occupancy(req, item);
  return ce.tis.filter(t => t!==req.teacher && !O.leave[t+'|'+item.date]);
}

function rst(r){
  if (['cancelled','approved','returned'].includes(r.status)) return r.status;
  if (r.items.some(i=>i.ack==='declined')) return 'fix';
  if (r.items.some(i=>i.ack==='pending')) return 'ack';
  return 'review';
}
const coverItems = r => r.items.filter(i => !NT.has(i.code));
const ackNeeded = it => it.method==='sub' || it.method==='swapT';
const ackWho = it => it.method==='sub' ? it.sub : it.method==='swapT' ? it.swap.t : null;
function buildItems(teacher, dates){
  const items=[];
  for (const d of dates){ const w=wd(d);
    for (let p=1;p<=9;p++){ const e=TAT[teacher][w][p]; if (!e) continue;
      items.push({id:d+'-'+p, date:d, p, code:e.code, subj:e.subj, cls:e.cls, room:e.room,
                  method: NT.has(e.code) ? 'none' : null, ack:null}); } }
  return items;
}

function hist(r, act, note, at){ r.history.push({at: at || new Date().toISOString(), by: ME ? ME.name : 'ระบบ', act, note: note||''}); }

function rolesOf(ti){

  if (ti!=null && Object.entries(S.settings.deptHeads).some(([g,h])=>h===ti)) r.push('dept');
  if (ti!=null && S.settings.acadHead===ti) r.push('acad');

const isDept = () => ME && ME.roles.includes('dept');

function myDayStrip(ti, d){
  const O = occupancy(null), w = wd(d);
  let h=''; for (let p=1;p<=9;p++){
    const e=TAT[ti][w][p], o=O.occ[K(ti,d,p)], L=O.leave[ti+'|'+d], fr=O.freed[K(ti,d,p)];
    let cls='slot', body='<span class="muted">ว่าง</span>';
    if (L && e){ cls+=' off'; body=`<span class="muted">${esc(e.code)} ${esc(e.cls)}</span><br><span class="tiny">${TYPES[L.type].label}</span>`; }
    else if (o){ cls+=' subst'; body=`<b style="color:var(--warn)">${o.t}</b>${esc(o.cls)}<br><span class="tiny">แทน ${esc(sn(o.r.teacher))}</span>`; }
    else if (e && !fr){ cls+= NT.has(e.code)?' nt':' teach'; body=`${esc(e.code)}<br><span class="tiny">${esc(e.cls)}</span>`; }
    else if (fr){ cls+=' off'; body='<span class="tiny">สลับออกแล้ว</span>'; }
    h+=`<div class="${cls}"><b>คาบ ${p} · ${perT(p).split('-')[0]}</b>${body}</div>`; }
  return `<div class="strip">${h}</div>`;
}

function stepper(cur){ const s=['ข้อมูลการลา','จัดรายคาบ','ส่ง → รับทราบ → เห็นชอบ'];
  return s.map((t,i)=>`<div class="step ${i<cur?'done':i===cur?'cur':''}"><span class="b">${i<cur?'✓':i+1}</span>${t}</div>`).join(''); }
function ownDutyConflicts(r){ const out=[];
  for (const q of S.requests){ if (q.status==='cancelled' || q.id===W?.editId) continue;
    for (const it of q.items){ if (it.ack==='declined') continue;
      if (ackWho(it)===r.teacher && r.dates.includes(it.date)) out.push({r:q,it});
      if ((it.method==='swapT'||it.method==='swapF') && q.teacher===r.teacher && r.dates.includes(it.swap.date)) out.push({r:q,it}); } }
  return out; }

function pickedText(it){
  if (it.method==='sub') return `<b>${esc(sn(it.sub))}</b> ${gtag(gOf(it.sub))}`;
  if (it.method==='swapT') return `สลับกับ <b>${esc(sn(it.swap.t))}</b> · คุณไปสอน ${fmtD(it.swap.date)} คาบ ${it.swap.p}`;
  if (it.method==='swapF') return `ย้ายไปสอน <b>${fmtD(it.swap.date)} คาบ ${it.swap.p}</b>`;
  if (it.method==='none') return 'ครูร่วมสอนดูแล';
  return '<span style="color:var(--bad)">ยังไม่ได้จัด</span>';
}
function loadBar(l){ let h=''; for (let i=0;i<Math.max(6,l.total);i++) h+=`<i class="${i<l.base?'f':i<l.total?'s':''}"></i>`; return `<span class="load" title="สอนตามตาราง ${l.base} + สอนแทน ${l.extra}">${h}</span>`; }
function itemEditor(r, it){
  const open = UI.open===it.id, tab = UI.tab[it.id] || (it.method && it.method!=='none' ? it.method : 'sub');
  const head = `<div class="item-h" data-act="iopen" data-iid="${it.id}">
    <span class="per">${fmtD(it.date)} · คาบ ${it.p}</span><span class="tiny muted">${perT(it.p)}</span>
    <span class="what">${esc(it.code)} ${esc(it.subj)}</span><span class="chip s-na">${esc(it.cls)}</span>
    <span class="pick">${pickedText(it)}</span></div>`;
  if (!open) return `<div class="item ${it.method?'done':''} ${it.ack==='declined'?'need':''}">${head}</div>`;
  const co = coTeachers(r,it);
  let body = `<div class="row" style="margin-bottom:10px"><div class="seg">

function boardRows(d){
  const rows=[]; for (const r of S.requests){ if (r.status==='cancelled') continue;
    for (const it of r.items){ if (NT.has(it.code)) continue;
      if (it.date===d) rows.push({r,it,p:it.p,kind:'out'});
      if ((it.method==='swapT'||it.method==='swapF') && it.swap.date===d) rows.push({r,it,p:it.swap.p,kind:'in'}); } }
  return rows.sort((a,b)=>a.p-b.p || a.it.cls.localeCompare(b.it.cls,'th'));
}
function boardTable(d, limit){

/* ---------- statistics ---------- */
function statData(from, to){
  const T = D.teachers.map((t,ti)=>({ti, g:t.g, days:{personal:0,official:0,mission:0,sick:0}, reqs:0, need:0, byHead:0, given:0, swapT:0, swapF:0, swapPartner:0}));
  const heat = [...Array(5)].map(()=>Array(10).fill(0)); let ackH=[], items=0, approved=0, same=0, subs=0;
  for (const r of S.requests){ if (r.status==='cancelled') continue;
    const ds = r.dates.filter(d=>d>=from&&d<=to); if (!ds.length) continue;
    const o=T[r.teacher]; o.reqs++; o.days[r.type]+=ds.length;
    for (const it of coverItems(r)){ if (it.date<from||it.date>to) continue;
      items++; o.need++; if (r.arrangedBy!==r.teacher) o.byHead++; if (r.status==='approved') approved++;
      heat[wd(it.date)][it.p]++;
      if (it.method==='sub' && it.ack!=='declined'){ T[it.sub].given++; subs++; if (gOf(it.sub)===gOf(r.teacher)) same++; }
      if (it.method==='swapT' && it.ack!=='declined'){ o.swapT++; T[it.swap.t].swapPartner++; }

}

      <td>${it.ackAt?fmtDT(it.ackAt):ackNeeded(it)?'ยังไม่รับทราบ':'-'}</td></tr>`).join('')}</tbody></table>
    <div class="sig"><div>ลงชื่อ ........................................ ผู้จัด<br>(${esc(tn(r.arrangedBy))})<br>${fmtDT(r.createdAt)}</div>
    <div>${r.approvedAt?`เห็นชอบ (อิเล็กทรอนิกส์)<br>${esc(r.approvedBy||'')}<br>${fmtDT(r.approvedAt)}`:'ลงชื่อ ........................................<br>หัวหน้ากลุ่มบริหารงานวิชาการ'}</div></div>`;
  window.print();
}
function printBoard(d){
  const rows=boardRows(d);
  $('#print').innerHTML = `<div style="text-align:center"><b>${esc(D.school)}</b></div><h2>ตารางสอนแทน ${fmtL(d)}</h2>
  <table><thead><tr><th>คาบ</th><th>ห้อง</th><th>วิชา</th><th>ครูเดิม</th><th>กรณี</th><th>ผู้สอน</th><th>สถานะ</th></tr></thead><tbody>
  ${rows.map(({r,it,p,kind})=>`<tr><td>${p} (${perT(p)})</td><td>${esc(it.cls)}</td><td>${esc(it.code)}</td><td>${esc(tn(r.teacher))}</td><td>${TYPES[r.type].label}</td>
    <td>${kind==='in'?esc(tn(r.teacher))+' (คาบคืน/ชดเชย)':it.method==='sub'?esc(tn(it.sub)):it.method==='swapT'?esc(tn(it.swap.t)):it.method==='swapF'?'ย้ายไป '+fmtD(it.swap.date):'ครูร่วมสอน'}</td><td>${RST[rst(r)].label}</td></tr>`).join('')}</tbody></table>`;
  window.print();
}

/* ---------- modal / toast ---------- */
function modal(html){ let ov=$('#ov'); if (!ov){ ov=document.createElement('div'); ov.id='ov'; ov.className='ov'; document.body.appendChild(ov);
  ov.addEventListener('click', e=>{ if (e.target===ov){ if (UI.fix) { UI.fix=null; } closeModal(); } }); } ov.innerHTML=html; }
function closeModal(){ const ov=$('#ov'); if (ov) ov.remove(); UI.detail=null; }
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }
function promptModal(title, ph, cb){
  modal(`<div class="modal sm"><div class="modal-h"><h3>${esc(title)}</h3><button class="x" data-act="close">×</button></div><div class="modal-b"><textarea id="pm" placeholder="${esc(ph)}"></textarea></div>
  <div class="modal-f"><button class="btn" data-act="close">ยกเลิก</button><button class="btn pri" id="pmok">ยืนยัน</button></div></div>`);
  $('#pmok').onclick = () => { const v=$('#pm').value.trim(); if (!v){ $('#pm').focus(); return; } cb(v); };
}

/* ---------- actions ---------- */
function doAck(r, it){ it.ack='ack'; it.ackAt=new Date().toISOString(); hist(r,'รับทราบ',`${fmtD(it.date)} คาบ ${it.p} ${it.cls}`); log('รับทราบ', r.id, `${fmtD(it.date)} คาบ ${it.p} ${it.cls}`);
  if (rst(r)==='review'){ hist(r,'ผู้ถูกจัดรับทราบครบ — ส่งหัวหน้ากลุ่มบริหารงานวิชาการ'); } }
document.addEventListener('click', e => {
  if (!e.target.closest('[data-act="bell"]')){ const dd=$('.dd'); if (dd && (!e.target.closest('.dd') || e.target.closest('[data-act],[data-go]'))) setTimeout(()=>dd.remove()); }
  const go = e.target.closest('[data-go]'); if (go){ VIEW=go.dataset.go; if (VIEW==='new' && !W) newDraft(); closeModal(); render(); window.scrollTo(0,0); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (e.target.closest('[data-stop]') && el.dataset.act==='open') return;
  const a = el.dataset.act, rid = el.dataset.rid, iid = el.dataset.iid;
  const R = rid ? S.requests.find(x=>x.id===rid) : null;
  switch(a){
    case 'login': login(+$('#lt').value); break;
    case 'qlogin': login(+el.dataset.ti); break;
    case 'qacad': login(null, true); break;
    case 'logout': ME=null; saveSess(); closeModal(); render(); break;
    case 'reset': if (confirm('ล้างข้อมูลตัวอย่างทั้งหมดและสร้างใหม่?')){ try{localStorage.removeItem(KEY);}catch(_){} seed(); W=null; ME=null; saveSess(); render(); } break;
    case 'bell': { const old=$('.dd'); if (old){ old.remove(); break; } const n=notifications(); const d=document.createElement('div'); d.className='dd';
      d.innerHTML = n.length ? n.map(x=>`<div class="it" ${x.rid?`data-act="open" data-rid="${x.rid}"`:`data-go="${x.go}"`}>${esc(x.t)}</div>`).join('') : '<div class="it muted">ไม่มีการแจ้งเตือน</div>';
      document.body.appendChild(d); break; }
    case 'open': openReq(rid); break;
    case 'close': closeModal(); if (UI.fix) UI.fix=null; break;
    case 'wtype': W.req.type=el.dataset.k; regen(); render(); break;
    case 'iopen': UI.open = UI.open===iid ? null : iid; rerenderEditor(); break;
    case 'itab': UI.tab[iid]=el.dataset.m; rerenderEditor(); break;
    case 'more': UI.more[iid]=!UI.more[iid]; rerenderEditor(); break;
    case 'pick': { const [r,it]=findItem(iid); it.method='sub'; it.sub=+el.dataset.ti; delete it.swap; afterPick(r,it); break; }
    case 'pickT': { const [r,it]=findItem(iid); const o=UI.cache[iid+'T'].list[+el.dataset.k]; it.method='swapT'; it.swap={t:o.t,date:o.date,p:o.p,code:o.code,subj:o.subj}; delete it.sub; afterPick(r,it); break; }
    case 'pickF': { const [r,it]=findItem(iid); const o=UI.cache[iid+'F'].list[+el.dataset.k]; it.method='swapF'; it.swap={date:o.date,p:o.p}; delete it.sub; afterPick(r,it); break; }
    case 'pickN': { const [r,it]=findItem(iid); it.method='none'; delete it.sub; delete it.swap; afterPick(r,it); break; }
    case 'autofill': { const r=W.req; for (const it of coverItems(r)) if (!it.method){ const c=candSub(r,it); if (c.avail.length){ it.method='sub'; it.sub=c.avail[0].ti; it.ack='pending'; } } UI.open=null; render(); break; }
    case 'wcancel': W=null; VIEW='home'; render(); break;
    case 'wsubmit': confirmSubmit(); break;
    case 'wsend': doSubmit(); break;
    case 'ack': doAck(R, R.items.find(i=>i.id===iid)); save(); toast('รับทราบแล้ว'); render(); if (UI.detail) renderDetail(); break;
    case 'ackall': myPending().forEach(({r,it})=>doAck(r,it)); save(); toast('รับทราบทั้งหมดแล้ว'); render(); break;
    case 'decline': promptModal('ขอเปลี่ยน (ไม่สะดวกสอนแทน)','ระบุเหตุผล เช่น ติดคุมสอบ / มีนัดผู้ปกครอง', v => { const it=R.items.find(i=>i.id===iid);
        it.ack='declined'; it.declNote=v; it.declAt=new Date().toISOString(); hist(R,'ขอเปลี่ยน',v); log('ขอเปลี่ยน', R.id, v); save(); closeModal(); toast('แจ้งผู้จัดให้จัดใหม่แล้ว'); render(); }); break;
    case 'fixitem': { const clone = JSON.parse(JSON.stringify(R)); const it=clone.items.find(i=>i.id===iid); UI.fix={req:clone, iid, prevWho:ackWho(it)}; it.declinedBy=[...(it.declinedBy||[]), ackWho(it)]; it.method=null; UI.tab[iid]='sub'; renderFixModal(); break; }
    case 'fixcancel': UI.fix=null; closeModal(); render(); break;
    case 'fixsave': { const {req,iid:fi}=UI.fix; const orig=S.requests.find(x=>x.id===req.id); const ni=req.items.find(i=>i.id===fi); const idx=orig.items.findIndex(i=>i.id===fi);
      orig.items[idx]=ni; hist(orig,'จัดใหม่',`${fmtD(ni.date)} คาบ ${ni.p} → ${METHODS[ni.method].label}`); log('จัดใหม่', orig.id, `${fmtD(ni.date)} คาบ ${ni.p}`); save(); UI.fix=null; toast('บันทึกแล้ว'); render(); openReq(orig.id); break; }
    case 'approve': R.status='approved'; R.approvedAt=new Date().toISOString(); R.approvedBy=ME.name; hist(R,'เห็นชอบ — การจัดสอนแทนสมบูรณ์'); log('เห็นชอบ', R.id, ''); save(); toast('เห็นชอบแล้ว'); render(); renderDetail(); break;
    case 'bulkapprove': { const ids=[...document.querySelectorAll('.apck:checked')].map(x=>x.value); if (!ids.length){ toast('ยังไม่ได้เลือกรายการ'); break; }
      ids.forEach(id=>{ const r=S.requests.find(x=>x.id===id); r.status='approved'; r.approvedAt=new Date().toISOString(); r.approvedBy=ME.name; hist(r,'เห็นชอบ — การจัดสอนแทนสมบูรณ์'); log('เห็นชอบ', r.id, 'เห็นชอบแบบกลุ่ม'); });
      save(); toast(`เห็นชอบ ${ids.length} รายการ`); render(); break; }
    case 'return': promptModal('ส่งกลับแก้ไข','ระบุสิ่งที่ต้องแก้ไข', v => { R.status='returned'; R.returnNote=v; hist(R,'ส่งกลับแก้ไข',v); log('ส่งกลับแก้ไข', R.id, v); save(); closeModal(); toast('ส่งกลับแล้ว'); render(); }); break;
    case 'editreq': { W={editId:R.id, req:JSON.parse(JSON.stringify(R)), start:R.dates[0], end:R.dates[R.dates.length-1]}; UI.open=null; closeModal(); VIEW='new'; render(); break; }
    case 'cancelreq': if (confirm('ยกเลิกคำขอนี้? ครูที่ถูกจัดจะได้รับแจ้ง')){ R.status='cancelled'; hist(R,'ยกเลิกคำขอ'); log('ยกเลิก', R.id, ''); save(); toast('ยกเลิกแล้ว'); render(); renderDetail(); } break;
    case 'printreq': printReq(R); break;
    case 'ltab': UI.listTab=el.dataset.k; render(); break;
    case 'aptab': UI.apTab=el.dataset.k; render(); break;
    case 'bday': UI.board=el.dataset.d; render(); break;
    case 'bprint': printBoard(el.dataset.d); break;
    case 'ssort': UI.statSort=el.dataset.k; render(); break;
    case 'person': personModal(+el.dataset.ti); break;
    case 'csv': exportCSV(); break;
  }
});
document.addEventListener('change', e => {
  const t=e.target;
  if (t.dataset.w){ const k=t.dataset.w, r=W.req;
    if (k==='teacher'){ r.teacher=+t.value; if (r.teacher!==ME.ti && !isAcad()) r.type='sick'; regen(); render(); }
    else if (k==='start'){ W.start=t.value; if (!W.end||W.end<W.start) W.end=W.start; regen(); render(); }
    else if (k==='end'){ W.end=t.value; regen(); render(); }
    else if (k==='reason') r.reason=t.value; else if (k==='file') r.file=t.value;
    return; }
  if (t.dataset.act==='bpick'){ UI.board=t.value; render(); return; }
  if (t.dataset.s){ UI[t.dataset.s]=t.value; render(); return; }
  if (t.dataset.set){ const st=S.settings, k=t.dataset.set;
    if (k==='head') st.deptHeads[t.dataset.g]=+t.value; else if (k==='acad') st.acadHead = t.value===''?null:+t.value;
    else if (k==='holidays') st.holidays=t.value.split(/\s+/).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x));
    else if (k==='maxAhead'||k==='leadDays') st[k]=Math.max(0,parseInt(t.value)||0); else st[k]=t.value;
    if (ME && ME.ti!=null){ const keep=ME.roles.includes('acad'); ME.roles=rolesOf(ME.ti); if (keep && !ME.roles.includes('acad')) ME.roles.push('acad','admin'); saveSess(); }
    save(); toast('บันทึกการตั้งค่าแล้ว'); render(); }
});
document.addEventListener('input', e => { if (e.target.dataset.act==='logq'){ UI.logQ=e.target.value; const pos=e.target.selectionStart; render(); const i=document.querySelector('[data-act="logq"]'); i.focus(); i.setSelectionRange(pos,pos); } });

/* ---------- boot ---------- */
S = load(); if (!S) seed();
ME = sess();
render();
</script>
