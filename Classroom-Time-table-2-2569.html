<title>ตารางเรียน KJST 2/2569</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600&family=Sarabun:wght@400;500;600;700&display=swap">
<style>
/* Layout: แถบหัวสีกรมท่า → แถบเลือกห้อง (ติดบนจอ) → หัวห้อง → ตาราง (สัปดาห์/รายวัน) → รายวิชาของห้อง */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --ink:#17203D; --muted:#5B6482; --line:#DCE1EE; --soft:#EBEEF7;
  --navy:#1B2A6B; --navy-ink:#FFFFFF; --accent:#1B2A6B; --gold:#C4922A; --gold-soft:#FBF1DC;
  --now:#0E7C55; --now-soft:#DDF3EA;
  --mon:#E2B714; --tue:#E26BA0; --wed:#2E9E5B; --thu:#E8862A; --fri:#3B7DD8;
  /* สีกลุ่มสาระ: พื้น / เส้นเน้น */
  --th-b:#FCE8EC; --th-f:#C23B5A;  --ma-b:#E4EEFC; --ma-f:#2F64C0;  --sc-b:#E2F4E8; --sc-f:#23874D;
  --so-b:#FBF0DA; --so-f:#B07612;  --pe-b:#FDE9DC; --pe-f:#C9601E;  --ar-b:#F1E6FA; --ar-f:#8A4FC2;
  --oc-b:#EFE8DF; --oc-f:#8A6440;  --fl-b:#DFF3F6; --fl-f:#1A8597;  --is-b:#E7E7FB; --is-f:#4F4FC4;
  --el-b:#FBF1DC; --el-f:#A9761A;  --ac-b:#E9EEF3; --ac-f:#56708A;
  --f-body:'Sarabun','Leelawadee UI','Thonburi',system-ui,sans-serif;
  --f-head:'Prompt','Sarabun','Leelawadee UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1322; --surface:#161D31; --ink:#E5E9F5; --muted:#9AA3C0; --line:#2A3352; --soft:#1D2540;
  --navy:#16204A; --navy-ink:#F2F4FB; --accent:#9DB0F5; --gold:#E3B654; --gold-soft:#3A3120;
  --now:#4FD39C; --now-soft:#163A2D;
  --th-b:#3A1E27; --th-f:#F28CA4;  --ma-b:#1C2B47; --ma-f:#8DB4F5;  --sc-b:#173426; --sc-f:#7FD3A2;
  --so-b:#3A2F17; --so-f:#E9C06A;  --pe-b:#3D2617; --pe-f:#F2A26C;  --ar-b:#2F2240; --ar-f:#C9A2F0;
  --oc-b:#30281F; --oc-f:#D2AE88;  --fl-b:#163339; --fl-f:#79CEDC;  --is-b:#23234A; --is-f:#A9A9F5;
  --el-b:#3A3120; --el-f:#E3B654;  --ac-b:#222B38; --ac-f:#A7BBCF;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1322; --surface:#161D31; --ink:#E5E9F5; --muted:#9AA3C0; --line:#2A3352; --soft:#1D2540;
  --navy:#16204A; --navy-ink:#F2F4FB; --accent:#9DB0F5; --gold:#E3B654; --gold-soft:#3A3120;
  --now:#4FD39C; --now-soft:#163A2D;
  --th-b:#3A1E27; --th-f:#F28CA4;  --ma-b:#1C2B47; --ma-f:#8DB4F5;  --sc-b:#173426; --sc-f:#7FD3A2;
  --so-b:#3A2F17; --so-f:#E9C06A;  --pe-b:#3D2617; --pe-f:#F2A26C;  --ar-b:#2F2240; --ar-f:#C9A2F0;
  --oc-b:#30281F; --oc-f:#D2AE88;  --fl-b:#163339; --fl-f:#79CEDC;  --is-b:#23234A; --is-f:#A9A9F5;
  --el-b:#3A3120; --el-f:#E3B654;  --ac-b:#222B38; --ac-f:#A7BBCF;
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1260px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* หัว */
.top{background:var(--navy);color:var(--navy-ink)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:14px}
.top img{width:46px;height:auto;flex:none}
.top h1{font-family:var(--f-head);font-weight:600;font-size:clamp(18px,2.4vw,24px);margin:0;line-height:1.2;text-wrap:balance}
.top p{margin:2px 0 0;font-size:13.5px;opacity:.82}
.top .term{margin-left:auto;text-align:right;font-size:13px;opacity:.9;white-space:nowrap}
.top .term b{display:block;font-family:var(--f-head);font-weight:600;font-size:16px;color:var(--gold)}

/* แถบเลือกห้อง */
.pick{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 6px 16px -14px rgba(10,20,60,.5)}
.pick .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding-block:10px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row .lab{font-size:12px;letter-spacing:.04em;color:var(--muted);margin-right:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-family:var(--f-head);font-weight:500;font-size:14px;min-width:44px;line-height:1.3;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.lv .chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1A1406}

/* หัวห้อง */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 24px;padding-block:20px 12px}
.head h2{font-family:var(--f-head);font-weight:600;font-size:clamp(28px,4.4vw,40px);margin:0;line-height:1.05;color:var(--accent)}
.head h2 small{font-size:.42em;font-weight:500;color:var(--muted);margin-left:6px}
.facts{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:14px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:600}
.views{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.views button{border:0;background:none;padding:7px 14px;font-size:14px;font-weight:500}
.views button[aria-pressed="true"]{background:var(--soft);color:var(--accent);font-weight:700}

/* ตารางสัปดาห์ */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.wk{border-collapse:separate;border-spacing:0;width:100%;min-width:1060px;table-layout:fixed}
.wk th{font-weight:500;font-size:12px;color:var(--muted);padding:8px 4px 6px;border-bottom:1px solid var(--line);background:var(--surface);font-variant-numeric:tabular-nums}
.wk th b{display:block;font-family:var(--f-head);font-weight:600;font-size:15px;color:var(--ink)}
.wk td{border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:4px;height:86px;vertical-align:top}
.wk tr:last-child td{border-bottom:0}
.wk td.day{border-left:0;padding:0 0 0 12px;vertical-align:middle;font-family:var(--f-head);font-weight:600;font-size:15px;position:relative}
.wk td.day::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:5px;border-radius:0 4px 4px 0;background:var(--dc)}
.wk td.day small{display:block;font-family:var(--f-body);font-weight:400;font-size:11.5px;color:var(--muted)}
.wk tr.today td.day{color:var(--now)}
.cell{height:100%;width:100%;border:0;border-radius:9px;padding:6px 8px;text-align:left;display:flex;flex-direction:column;gap:1px;background:var(--b,var(--soft));box-shadow:inset 3px 0 0 var(--f,transparent);overflow:hidden}
.cell:hover{filter:brightness(.97)}
.cell .c{font-size:11.5px;font-weight:700;color:var(--f);letter-spacing:.02em}
.cell .s{font-weight:600;font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cell .t{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .r{margin-top:auto;font-size:11.5px;font-weight:600;color:var(--f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.free{background:transparent;box-shadow:none;border:1px dashed var(--line);color:var(--muted);align-items:center;justify-content:center;font-size:13px;cursor:default}
.cell.lunch{background:repeating-linear-gradient(135deg,var(--soft) 0 6px,transparent 6px 12px);box-shadow:none;align-items:center;justify-content:center;color:var(--muted);font-size:13px;font-weight:600;cursor:default}
.cell.hr .s{font-size:12.5px}
.cell.now{outline:2px solid var(--now);outline-offset:-2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:12px 2px 0;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;background:var(--b);box-shadow:inset 3px 0 0 var(--f)}

/* รายวัน */
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.days button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px 7px;font-family:var(--f-head);font-weight:500;font-size:15px;position:relative;line-height:1.2}
.days button small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:400}
.days button::after{content:"";position:absolute;left:22%;right:22%;bottom:4px;height:3px;border-radius:3px;background:var(--dc);opacity:.35}
.days button[aria-pressed="true"]{border-color:var(--dc);box-shadow:inset 0 0 0 1px var(--dc)}
.days button[aria-pressed="true"]::after{opacity:1}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:stretch}
.item .when{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);padding-top:9px;line-height:1.3}
.item .when b{display:block;font-family:var(--f-head);font-weight:600;font-size:14px;color:var(--ink)}
.item .cell{min-height:64px;padding:9px 12px;gap:2px}
.item .cell .s{font-size:15px;-webkit-line-clamp:3}
.item .cell .t{font-size:13px;white-space:normal}
.item .cell .r{font-size:12.5px;margin-top:2px}
.item .cell.lunch,.item .cell.free{min-height:44px}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:1px}
.badge.now{background:var(--now);color:var(--surface)}
.badge.next{background:var(--now-soft);color:var(--now)}

/* รายวิชา */
.sec{font-family:var(--f-head);font-weight:600;font-size:19px;margin:30px 0 10px;color:var(--ink)}
.sec small{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted);margin-left:8px}
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.sub{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:inset 4px 0 0 var(--f);min-width:0}
.sub .c{font-size:12px;font-weight:700;color:var(--f)}
.sub .s{font-weight:600;grid-column:1}
.sub .t{font-size:13px;color:var(--muted);grid-column:1}
.sub .n{grid-row:1/4;grid-column:2;align-self:center;text-align:right;font-family:var(--f-head);font-weight:600;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.sub .n small{display:block;font-family:var(--f-body);font-weight:400;font-size:11px;color:var(--muted);margin-top:3px}
footer{margin:34px 0 28px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 18px;justify-content:space-between}

/* แผงรายละเอียด */
.scrim{position:fixed;inset:0;background:rgba(8,12,30,.45);z-index:40;opacity:0;transition:opacity .18s}
.scrim.on{opacity:1}
.sheet{position:fixed;z-index:41;background:var(--surface);color:var(--ink);box-shadow:0 18px 50px -12px rgba(5,10,40,.45);
  left:50%;top:50%;width:min(560px,calc(100vw - 32px));max-height:min(80vh,720px);transform:translate(-50%,-48%);opacity:0;transition:transform .2s,opacity .2s;border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
.sheet.on{transform:translate(-50%,-50%);opacity:1}
.sheet header{padding:16px 18px 12px;border-bottom:1px solid var(--line);box-shadow:inset 0 4px 0 var(--f);display:flex;gap:12px;align-items:flex-start}
.sheet header .c{font-size:12.5px;font-weight:700;color:var(--f)}
.sheet header h3{margin:2px 0 0;font-family:var(--f-head);font-weight:600;font-size:19px;line-height:1.3}
.sheet header .x{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;flex:none;font-size:18px;line-height:1}
.sheet .body{padding:12px 18px 18px;overflow:auto}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;font-size:14.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}
.opt{display:grid;grid-template-columns:auto 1fr;gap:0 10px;padding:9px 0;border-top:1px solid var(--line)}
.opt:first-of-type{border-top:0}
.opt .c{font-size:12px;font-weight:700;color:var(--el-f);padding-top:2px;font-variant-numeric:tabular-nums}
.opt .s{font-weight:600}
.opt .t{grid-column:2;font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);background:var(--soft);border-radius:10px;padding:8px 12px;margin:0 0 10px}
@media (max-width:640px){
  .sheet{left:0;right:0;top:auto;bottom:0;width:auto;max-height:82vh;border-radius:18px 18px 0 0;transform:translateY(24px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .sheet.on{transform:none}
  .top .term{display:none}
  .head{padding-block:16px 10px}
  .views{margin-left:0}
  .pick .wrap{gap:6px 12px;padding-block:8px}
  .row{gap:4px}
  .chip{min-width:38px;padding:4px 8px;font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function shortName(n){
  const m = n.match(/^(Mr|Ms|Mrs|Miss)\.?\s*(\S+)/i); if (m) return `${m[1]}. ${m[2]}`;
  return 'ครู' + n.replace(TITLE_RE,'').split(/\s+/)[0];
}
const teachers = ids => ids.map(i => D.names[i]);

function slot(c, d, p){ const v = D.classes[c][`${d}-${p}`]; if (!v) return null;
  const [code, subj, tids, room, st, area] = v; return {code, subj, tids, room, st, area, key: AREA[area] || (st==='HR' ? 'ac' : '')}; }
const sig = s => s ? [s.code, s.subj, s.tids.join(','), s.room, s.st].join('|') : '';
function kind(s){ if (!s) return 'free'; if (s.st === 'พักกลางวัน') return 'lunch'; if (s.st === 'ว่าง') return 'free'; if (s.st === 'HR') return 'hr'; if (s.code === 'เลือก') return 'el'; return 'class'; }
const isRealCode = c => /^[ก-ฮA-Z]\d{5}$/.test(c||'');

/* เวลาไทย */
function bkkNow(){
  const f = new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Bangkok',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false});
  const parts = Object.fromEntries(f.formatToParts(new Date()).map(x => [x.type, x.value]));
  const d = ['Mon','Tue','Wed','Thu','Fri'].indexOf(parts.weekday);
  return {day:d, min: (+parts.hour % 24) * 60 + +parts.minute};
}
const span = t => t.split('-').map(x => { const [h,m] = x.split('.').map(Number); return h*60+m; });
function periodState(d, p){
  const n = bkkNow(); if (n.day !== d) return '';
  const [a,b] = span(D.times[p]); if (n.min >= a && n.min < b) return 'now';
  return '';
}
function nextPeriod(d){
  const n = bkkNow(); if (n.day !== d) return -1;
  for (let p = 0; p < 10; p++){ const [a] = span(D.times[p]); if (a > n.min) return p; }
  return -1;
}

}
function cellHTML(s, c, d, p, extraCls){
  const k = kind(s);
  if (k === 'lunch') return `<div class="cell lunch">พักกลางวัน</div>`;
  if (k === 'free') return `<div class="cell free">ว่าง</div>`;
  const vars = s.key ? `--b:var(--${s.key}-b);--f:var(--${s.key}-f)` : '';
  const ts = teachers(s.tids);
  let code = isRealCode(s.code) ? s.code : (k==='hr' ? 'HR' : '');
  let title = s.subj, who = ts.map(shortName).join(', ');
  if (k === 'el'){ code = 'วิชาเลือก'; title = s.subj.replace('เลือกตามความสนใจ','เลือกตามความสนใจ').replace(/^(เพิ่มเติมเลือก|กลุ่มเตรียม)/,'$1'); const n = (D.opts[`${s.subj}|${d}-${p}`]||[]).length; who = `${n} รายวิชาให้เลือก`; }
  const room = s.room && s.room !== homeRoom(c) ? s.room : '';
  return `<button type="button" class="cell ${k} ${extraCls||''}" style="${vars}" data-d="${d}" data-p="${p}">
    ${code?`<span class="c">${esc(code)}</span>`:''}<span class="s">${esc(title)}</span>${who?`<span class="t">${esc(who)}</span>`:''}${room?`<span class="r">${esc(room)}</span>`:''}</button>`;
}
function renderWeek(){

      h += `<td colspan="${n}">${cellHTML(s,c,d,p, now?'now':'')}</td>`; p += n-1;

  const old = $('#view .scroll'), sl = old ? old.scrollLeft : 0;
  $('#view').innerHTML = h + '</tbody></table></div>';
  if (sl) $('#view .scroll').scrollLeft = sl;
}
function renderDay(){
  const c = cur, nx = nextPeriod(day);
  let h = `<div class="days" role="group" aria-label="เลือกวัน">${DAYS.map((x,d) => `<button type="button" style="--dc:${DAYC[d]}" aria-pressed="${d===day}" data-day="${d}">${DAYS_S[d]}<small>${d===bkkNow().day?'วันนี้':x}</small></button>`).join('')}</div><div class="list">`;
  for (let p = 0; p < 10; p++){
    const s = slot(c,day,p); let n = 1;
    if (p > 0 && kind(s) !== 'free') while (p+n < 10 && sig(slot(c,day,p+n)) === sig(s)) n++;
    let st = ''; for (let q = p; q < p+n; q++){ if (periodState(day,q)==='now') st = 'now'; }
    if (!st && nx >= p && nx < p+n) st = 'next';
    const t0 = D.times[p].split('-')[0], t1 = D.times[p+n-1].split('-')[1];
    const lab = p === 0 ? 'HR' : n > 1 ? `คาบ ${p}–${p+n-1}` : `คาบ ${p}`;
    const badge = st === 'now' ? '<span class="badge now">กำลังเรียน</span>' : st === 'next' ? '<span class="badge next">ถัดไป</span>' : '';
    h += `<div class="item"><div class="when"><b>${lab}</b>${t0}–${t1}</div><div>${cellHTML(s,c,day,p, st==='now'?'now':'').replace('<span class="s">', `<span class="s">`)}${badge?`<div style="margin-top:4px">${badge}</div>`:''}</div></div>`;
    p += n-1;
  }
  $('#view').innerHTML = h + '</div>';
}
function renderFacts(){
  const c = cur; let cls = 0; const adv = new Set(); const areas = new Set();
  Object.values(D.classes[c]).forEach(([code,subj,tids,room,st,area]) => { if (st==='คาบเรียน') cls++; if (st==='HR') tids.forEach(t => adv.add(D.names[t])); if (AREA[area]) areas.add(AREA[area]); });
  $('#cname').innerHTML = `${esc(c)}<small>ชั้นมัธยมศึกษาปีที่ ${c[2]}</small>`;
  $('#facts').innerHTML = `<span>ครูที่ปรึกษา <b>${[...adv].map(esc).join(', ')||'-'}</b></span><span>เรียน <b>${cls}</b> คาบ/สัปดาห์</span><span>พักกลางวัน <b>คาบ ${lunchP(c)}</b> (${D.times[lunchP(c)]} น.)</span>`;
  $('#legend').innerHTML = Object.keys(AREA_LABEL).filter(k => areas.has(k)).map(k => `<span style="--b:var(--${k}-b);--f:var(--${k}-f)"><i></i>${AREA_LABEL[k]}</span>`).join('');
}
function renderSubjects(){
  const c = cur, m = new Map();
  Object.entries(D.classes[c]).forEach(([k,[code,subj,tids,room,st,area]]) => {
    if (st !== 'คาบเรียน') return;
    const key = code + '|' + subj; const x = m.get(key) || {code, subj, t:new Set(), n:0, area};
    x.n++; tids.forEach(t => x.t.add(D.names[t])); m.set(key, x);
  });
  const list = [...m.values()].sort((a,b) => (a.code==='เลือก') - (b.code==='เลือก') || a.code.localeCompare(b.code,'th'));
  $('#subnote').textContent = `${list.length} รายการ · นับจากคาบในตาราง`;
  $('#subs').innerHTML = list.map(x => { const k = AREA[x.area] || 'ac'; const el = x.code === 'เลือก';
    return `<div class="sub" style="--f:var(--${k}-f)"><span class="c">${esc(el?'วิชาเลือก':x.code)}</span><span class="s">${esc(x.subj)}</span><span class="t">${esc(el?'นักเรียนเรียนตามรายวิชาที่ลงทะเบียน':[...x.t].join(', '))}</span><span class="n">${x.n}<small>คาบ/สัปดาห์</small></span></div>`; }).join('');
}
function render(){
  renderPicker(); renderFacts();
  $('#vWeek').setAttribute('aria-pressed', view==='week'); $('#vDay').setAttribute('aria-pressed', view==='day');
  view === 'week' ? renderWeek() : renderDay();
  renderSubjects();
  document.title = `ตารางเรียน ${cur} · KJST 2/2569`;
}
function setClass(c, push){
  cur = c; store.set('kjst-class', c);
  if (push && location.hash !== toHash(c)) { try { history.replaceState(null,'',toHash(c)); } catch(e){ location.hash = toHash(c); } }
  render();
}

/* แผงรายละเอียด */
function openSheet(d, p){
  const s = slot(cur, d, p); if (!s) return; const k = kind(s);
  let n = 1; if (p > 0) while (p+n < 10 && sig(slot(cur,d,p+n)) === sig(s)) n++;
  const when = `วัน${DAYS[d]} ${p===0?'HR':n>1?`คาบ ${p}–${p+n-1}`:`คาบ ${p}`} (${D.times[p].split('-')[0]}–${D.times[p+n-1].split('-')[1]} น.)`;
  const vars = `--f:var(--${s.key||'ac'}-f)`;
  let body = '';
  if (k === 'el'){
    const opts = D.opts[`${s.subj}|${d}-${p}`] || [];
    body = `<p class="note">${esc(when)} · นักเรียนเรียนตามรายวิชาที่ลงทะเบียนไว้ ${opts.length} รายวิชาในช่วงนี้</p>` +
      opts.map(([code,subj,t,room]) => `<div class="opt"><span class="c">${esc(code)}</span><span class="s">${esc(subj)}</span><span class="t">${esc(D.names[t])}${room && !/^(เลือก|กลุ่ม|เพิ่มเติม)/.test(room)?` · ${esc(room)}`:''}</span></div>`).join('');
  } else {
    const ts = teachers(s.tids);
    body = `<dl class="kv"><dt>เวลา</dt><dd>${esc(when)}</dd>${ts.length?`<dt>${s.st==='HR'?'ครูที่ปรึกษา':'ครูผู้สอน'}</dt><dd>${ts.map(esc).join('<br>')}</dd>`:''}<dt>สถานที่</dt><dd>${esc(s.room||'-')}</dd>${s.area?`<dt>กลุ่มสาระ</dt><dd>${esc(s.area)}</dd>`:''}</dl>`;
  }
  const code = k==='el' ? 'วิชาเลือก' : isRealCode(s.code) ? s.code : (k==='hr'?'HR':'');
  const sh = $('#sheet'), sc = $('#scrim');
  sh.style.cssText = vars;
  sh.innerHTML = `<header><div><span class="c">${esc(code)}</span><h3 id="shTitle">${esc(s.subj)}</h3></div><button type="button" class="x" id="shClose" aria-label="ปิด">✕</button></header><div class="body">${body}</div>`;
  sh.hidden = false; sc.hidden = false; requestAnimationFrame(() => { sh.classList.add('on'); sc.classList.add('on'); });
  $('#shClose').focus();
}
function closeSheet(){ const sh = $('#sheet'), sc = $('#scrim'); sh.classList.remove('on'); sc.classList.remove('on'); setTimeout(() => { sh.hidden = true; sc.hidden = true; }, 180); }

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) { if (e.target.id === 'scrim') closeSheet(); return; }
  if (b.dataset.lv){ const first = CLASSES.find(c => c.startsWith(b.dataset.lv+'/')); const same = CLASSES.find(c => c === b.dataset.lv + '/' + cur.split('/')[1]); setClass(same || first, true); }
  else if (b.dataset.c) setClass(b.dataset.c, true);
  else if (b.dataset.day){ day = +b.dataset.day; renderDay(); }
  else if (b.id === 'vWeek' || b.id === 'vDay'){ view = b.id === 'vWeek' ? 'week' : 'day'; store.set('kjst-view', view); render(); }
  else if (b.id === 'shClose') closeSheet();
  else if (b.classList.contains('cell') && b.dataset.d != null) openSheet(+b.dataset.d, +b.dataset.p);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
window.addEventListener('hashchange', () => { const c = fromHash(); if (c && c !== cur) setClass(c, false); });

(function init(){
  const today = bkkNow().day; day = today >= 0 ? today : 0;
  const saved = store.get('kjst-view');
  view = saved === 'week' || saved === 'day' ? saved : (window.matchMedia('(min-width: 900px)').matches ? 'week' : 'day');
  const c = fromHash() || (D.classes[store.get('kjst-class')] ? store.get('kjst-class') : CLASSES[0]);
  setClass(c, false);
  setInterval(() => { if (view === 'day') renderDay(); else renderWeek(); }, 60000);   // ปรับป้าย "กำลังเรียน" ทุกนาที
})();
</script>
